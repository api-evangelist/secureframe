apis:
- aid: secureframe:mcp-server
  name: Secureframe MCP Server
  description: >-
    First-party hosted (remote) Model Context Protocol server exposing the Secureframe compliance platform
    as 112 tools across 41 categories — 63 read, 49 write — mapped one-for-one onto the Public API operations.
    Authenticated with OAuth 2.1 (authorization code + PKCE S256, dynamic client registration) or with
    a REST API key and secret for headless clients. Every request runs as a specific Secureframe user
    in a specific company and is bounded by that user's RBAC permissions.
  humanURL: https://mcp.secureframe.com/mcp_docs
  baseURL: https://mcp.secureframe.com
  tags:
  - MCP
  - Agents
  - GRC
  - Compliance
  properties:
  - type: MCPServer
    url: mcp/secureframe-mcp.yml
  - type: ToolCrosswalk
    url: mcp/secureframe-tool-crosswalk.yml
  - type: Documentation
    url: https://mcp.secureframe.com/mcp_docs
  - type: OAuthScopes
    url: scopes/secureframe-scopes.yml
  - type: WellKnown
    url: well-known/secureframe-well-known.yml
