aid: secureframe
url: https://raw.githubusercontent.com/api-evangelist/secureframe/refs/heads/main/apis.yml
name: Secureframe
kind: company
description: >-
  Secureframe automates security and privacy compliance for SOC 2, ISO 27001, HIPAA,
  PCI DSS, GDPR, CMMC, FedRAMP, NIST 800-171 and more. Its Public API is a
  112-operation, JSON:API-shaped REST contract over the compliance record of truth —
  frameworks, requirements, controls, tests, evidence, policies, risks, personnel,
  devices, cloud resources, repositories, third-party vendors, trust center requests,
  and the System Security Plan and POA&M artifacts CMMC and FedRAMP assessments are
  conducted against. Secureframe also runs a first-party hosted MCP server that
  exposes all 112 operations as agent-callable tools over OAuth 2.1.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: false
  label: Hosted service · you call their endpoint
  confidence: medium
  source:
