apis:
  - aid: secureframe:public-api
    name: Secureframe Public API
    description: >-
      REST API providing programmatic access to Secureframe controls, frameworks,
      framework requirements, tests, evidence, policies, tasks, risks, personnel,
      devices, cloud resources, repositories, third-party risk vendors, knowledge base
      answers, trust center requests, and the SSP and POA&M records used in CMMC and
      FedRAMP assessments. 76 paths, 112 operations, 41 resource tags. Resource-oriented
      and JSON:API-shaped, with Lucene-syntax search, page/per_page pagination and
      include/relationships compound documents. Authenticated with an API key and secret
      sent as a single space-separated Authorization header; permissions are inherited
      from the RBAC role of the user the key belongs to.
    humanURL: https://developer.secureframe.com/
    baseURL: https://api.secureframe.com
    tags:
      - GRC
      - Compliance
      - REST
      - CMMC
      - Audit
