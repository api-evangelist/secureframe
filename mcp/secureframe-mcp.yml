specification: API Commons MCP Server
specificationVersion: '0.1'
provider: Secureframe
providerId: secureframe
generated: '2026-08-27'
modified: '2026-08-27'
method: searched
source: https://mcp.secureframe.com/mcp_docs
name: Secureframe MCP Server
description: Secureframe publishes a first-party hosted (remote) MCP server that exposes its compliance
  platform — controls, tests, evidence, frameworks, risks, vendors, personnel, SSP and POA&M records —
  as 112 MCP tools across 41 categories. The tools wrap the Secureframe REST API one-for-one; every request
  runs as a specific Secureframe user in a specific company and is bounded by that user's existing RBAC
  permissions.
status: live
deployment:
  mode: remote
  endpoint: https://mcp.secureframe.com/
  auth: oauth
  verified: probed
  note: 'Probed 2026-08-27: POST https://mcp.secureframe.com/mcp with an anonymous tools/list returned
    HTTP 401 {"message":"Authorization failed"}, and /.well-known/oauth-authorization-server + /.well-known/oauth-protected-resource
    both returned 200 — a live, OAuth-gated remote MCP endpoint. Secureframe also accepts a REST API key/secret
    pair in the Authorization header for headless clients. A first-party local-stdio server once existed
    at github.com/secureframe/secureframe-mcp-server (Python, MIT, 11 read-only tools) but its README
    now reads "Deprecated ... please use the Secureframe hosted MCP server instead" and the repo is archived,
    so mode is remote, not both.'
endpoints:
- region: United States
  url: https://mcp.secureframe.com/
  probed_status: 401
  note: anonymous tools/list rejected; OAuth or API-key required
- region: United Kingdom
  url: https://mcp-uk.secureframe.com/
  probed_status: null
  note: published in the provider docs region table; not probed
transport: streamable-http
authentication:
  primary: OAuth 2.1 authorization code + PKCE (S256) with dynamic client registration
  authorization_server: https://mcp.secureframe.com
  authorization_endpoint: https://mcp.secureframe.com/oauth/authorize
  token_endpoint: https://mcp.secureframe.com/oauth/token
  registration_endpoint: https://mcp.secureframe.com/register
  revocation_endpoint: https://mcp.secureframe.com/oauth/revoke
  scopes:
  - mcp
  access_token_lifetime: 1 hour, silently refreshed; refresh credential rotates on each use
  alternative: 'REST API key + secret sent as "Authorization: <API_KEY> <API_SECRET>" (no browser flow)'
  authorization_model: Runs as the signed-in Secureframe user in one selected company; bounded by that
    user's RBAC role.
  who_can_authorize: Active member who is an admin/super admin, whose role can create API keys, or who
    already owns an active API key.
install:
  claude_code: claude mcp add --transport http secureframe https://mcp.secureframe.com/
  json_client:
    mcpServers:
      secureframe:
        type: http
        url: https://mcp.secureframe.com/
