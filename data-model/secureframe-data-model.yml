modified: '2026-08-27'
method: derived
source: derived from components.schemas $ref links and *_id reference fields in openapi/secureframe-public-api-openapi.yml
description: 'Entity-relationship graph of the Secureframe compliance data model as the public contract declares
  it: 40 component schemas addressed by 112 operations across 41 resource tags. Identifiers are UUIDs throughout
  — there are no typed id prefixes.'
identifiers:
  style: uuid
  prefixed: false
  note: 'Every resource id is a bare UUID (format: uuid). Nothing in an id says what it identifies, so an agent
    holding a loose id cannot route it to the right endpoint without external context — the opposite of a prefixed-id
    scheme.'
clusters:
- name: Compliance program
  entities:
  - Framework
  - FrameworkRequirement
  - Control
  - Test
  - Evidence
  - Policy
  - PolicyDetail
  - Task
  note: 'The SOC 2 / ISO 27001 / HIPAA core: a Framework decomposes into FrameworkRequirements, satisfied by
    Controls, proven by Tests and Evidence.'
- name: System Security Plan (NIST 800-171 / CMMC)
  entities:
  - SspReport
  - SspReportSection
  - SspReportSectionBlock
  - SspReportAssessmentObjective
  - SspPolicy
  - SspRole
  - SspDuty
  - SspDutyRole
  - SspVendor
  - PoamItem
  note: A composed document tree — report, sections, section blocks — plus the duty-assignment matrix (duties
    x roles) and the POA&M register.
- name: Asset inventory
  entities:
  - CloudResource
  - Device
  - Repository
  - FrameworkAssetScope
  note: Each asset type carries its own framework_asset_scopes subresource, which is how an asset is scoped
    into or out of a given framework audit.
- name: People and access
  entities:
  - User
  - UserAccount
  - UserSecuritySetting
  note: User is personnel; UserAccount is an account discovered in a connected integration, linkable to a User
    via PUT /user_accounts/{id}/link.
- name: Third-party risk
  entities:
  - Vendor
  - VendorRiskDetail
  - VendorRiskSubassessmentResponse
  - IntegrationConnection
  note: Vendor is the deprecated legacy surface; VendorRiskDetail is the current TPRM model.
- name: Trust and questionnaires
  entities:
  - TrustCenterRequest
  - TrustCenterResource
  - TrustCenterResourceRequest
  - SecurityQuestionnaire
  - KnowledgeBaseQuestion
  - KnowledgeBaseAnswer
  note: 'The outward-facing trust surface: prospects request resources, and questionnaires are answered from
    a reusable knowledge base.'
- name: Cross-cutting
  entities:
  - Comment
  - FileUpload
  - TestExport
  - Models_CustomConnections_CreateResourceDataRequest
  note: FileUpload is not a resource so much as a staging handshake — see conventions/.
