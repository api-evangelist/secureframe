description: Secureframe publishes NO first-party client SDK in any package registry. Searched npm (registry.npmjs.org/-/v1/search?text=secureframe),
  PyPI, RubyGems and crates.io on 2026-08-27; the only npm hits are unrelated third-party packages (secureframe-react
  wraps SecurePay, react-secure-frame is an iframe helper). The API reference documents raw cURL only. The
  one first-party distributable Secureframe ever shipped — a Python MCP server on GitHub — was archived and
  marked deprecated on 2026-07-17 in favour of the hosted MCP endpoint.
