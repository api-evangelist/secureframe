openapi: 3.2.0
info:
  title: Secureframe Test API
  description: '## Introduction


    Secureframe exposes a REST API for use by customers, partners, and community developers.'
  version: '2023-10-18'
  x-logo:
    url: https://media.secureframe.com/logo-dark.svg
servers:
- url: https://api.secureframe.com
- url: https://api-uk.secureframe.com
tags:
- name: Test
  description: This document describes the API for reading, creating, and updating Tests.
paths:
  /tests:
    get:
      tags:
      - Test
      operationId: companyTestsIndex
      parameters:
      - name: include
        description: Comma delimited string of relationships to include.
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - enabled_field_updated_by
            - owner
            - promoted_by
        explode: false
        style: form
      - name: page
        description: 'Used for pagination of response data (default: page 1). Specifies the offset of the next block of data to receive.'
        required: false
        in: query
        schema:
          type: integer
      - name: per_page
        description: 'Used for pagination of response data (default: 100 items per response). Specifies the number of results for a given page.'
        required: false
        in: query
        schema:
          type: integer
      - name: q
        description: Search and filter the Test data using Lucene syntax.
        required: false
        in: query
        schema:
          type: string
      - name: relationships
        description: 'Set to true to return the associated relationships data within the response. (default: false)'
        required: false
        in: query
        schema:
          type: boolean
      - name: sort
        description: 'Comma delimited string of fields to sort the results by, applied in the order given. Prefix a field with `-` to sort it in descending order, for example `?sort=-author_name,created_at`. Sortable fields: `author_name`, `created_at`, `custom`, `description`, `enabled`, `enabled_field_updated_by_user`, `frameworks`, `health_status`, `id`, `key`, `last_evaluated`, `next_due_date`, `owner_assigned_at`, `owner_name`, `pass`, `passed_with_upload`, `promote_at`, `recommended_action`, `required_implementation_date`, `resource_category`, `status`, `test_domain`, `test_function`, `test_interval_seconds`, `test_type`, `title`, `tolerance_window_seconds`, `updated_at`, `vendor_name`.'
        required: false
        in: query
        schema:
          type: string
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of resources matching the query
                    items:
                      type: object
                      description: Data envelope for the response
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The identifier for this resource
                        type:
                          type: string
                          description: The type of resource this object is
                        attributes:
                          $ref: '#/components/schemas/Test'
                        relationships:
                          type: object
                          description: Nested objects related to the top level object
                        links:
                          type: object
                          description: Links to related API resources
                  meta:
                    type: object
                    description: Metadata about the list response
                    properties:
                      total:
                        type: integer
                        description: Total number of records matching the query across all pages, independent of page and per_page
                  included:
                    type: array
                    items:
                      type: object
                      description: Various objects that have been included via the `include` param
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The identifier for this resource
        '403':
          description: Forbidden
        '401':
          description: Unauthorized
        '400':
          description: Bad Request
      description: 'Returns a list of Tests.

        ### Search parameters


        - `author_name` — The author name of the Test

        - `created_at` — The date when this Test was created

        - `custom` — True if the Test is custom (user generated), false if it''s Secureframe-authored

        - Valid values: `true`, `false`

        - `description` — The description of the Test

        - `enabled` — True if the Test is currently enabled

        - Valid values: `true`, `false`

        - `enabled_field_updated_by_user` — True if the Test''s enabled field was last changed by a user, false otherwise

        - Valid values: `true`, `false`

        - `frameworks` — The framework keys for this Test

        - `health_status` — The overall health of the Test

        - Valid values: `pass`, `at_risk`, `fail`, `disabled`

        - `id` — The ID of the Test

        - `key` — The user-friendly identifier used to reference this Test

        - `last_evaluated` — The date the Test was last evaluated at

        - `next_due_date` — The date new Test evidence is needed by if applicable

        - `owner_assigned_at` — The date the Test owner was assigned

        - `owner_name` — The Test owner''s name

        - `pass` — True if the Test is passing, false otherwise. [DEPRECATED - Use health_status instead]

        - Valid values: `true`, `false`

        - `passed_with_upload` — True if the Test passed from the existence of an upload, false otherwise

        - Valid values: `true`, `false`

        - `promote_at` — The current date set for implementation of the Test

        - `recommended_action` — Actions for completing the Test

        - `required_implementation_date` — The pre-configured date the Test must be implemented by

        - `resource_category` — The category the Test resource belongs to

        - `status` — The status of the Test. [DEPRECATED - Use health_status instead]

        - Valid values: `pass`, `at_risk`, `fail`, `disabled`

        - `test_domain` — The domain the Test belongs to

        - `test_function` — The purpose of the Test

        - `test_interval_seconds` — The interval in which Test evidence should be collected if applicable

        - `test_type` — The type of Test

        - `title` — The title of the Test

        - `tolerance_window_seconds` — The time between the Test interval elapsing and evidence becoming stale and Test failing if applicable

        - `updated_at` — The date the Test was last updated

        - `vendor_name` — The vendor name associated with the Test if applicable'
      summary: List Tests
      security:
      - header_authorization: []
      x-controller: api/company_tests
      x-action: index
    post:
      tags:
      - Test
      operationId: companyTestsCreate
      parameters:
      - name: control_ids
        description: The IDs of the controls to map this test to.
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            format: uuid
        explode: true
      - name: description
        description: The description for the test.
        required: false
        in: query
        schema:
          type: string
      - name: detailed_remediation_steps
        description: Guidance for remediating this test in the event it fails.
        required: false
        in: query
        schema:
          type: string
      - name: owner_id
        description: The UUID of a user.
        required: false
        in: query
        schema:
          type: string
          format: uuid
      - name: resource_category
        description: The category the test resource belongs to.
        required: false
        in: query
        schema:
          type: string
          enum:
          - Access Key
          - Access Point
          - Agent
          - Authentication Factor
          - Background Screening
          - Block Storage
          - Board of Directors
          - Cardholder Data
