      - name: test_domain
        description: The domain the test belongs to.
        required: false
        in: query
        schema:
          type: string
          enum:
          - Asset Management
          - Availability
          - Change Management
          - Communications
          - Data Security
          - Governance
          - Identity and Access Management
          - Incident Response
          - Network Security
          - Physical Security
          - Privacy
          - Risk Management
          - Vendor Management
          - Vulnerability Management
      - name: test_function
        description: The purpose of the test.
        required: false
        in: query
        schema:
          type: string
          enum:
          - Access Control
          - Agreements
          - Approval
          - Architecture
          - Backup
          - Baseline Configuration
          - Business Continuity
          - Capacity Monitoring
          - Certificate Management
          - Charter
