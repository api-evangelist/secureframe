          - Gap Remediation
          - High Availability
          - Human Resources
          - Incident Management
          - Infrastructure Security
          - Integration Testing
          - Internal and External Channels
          - Internal Audit
          - Internal Controls
          - Inventory
          - Key Management
          - Lawful Basis
          - Least Functionality
          - Least Privilege
          - Logging
          - Media Handling
          - Multi-factor Authentication
          - Network Security
          - Objectives
          - Password Complexity
          - Password Management
          - Password Reset
          - Patching
          - Penetration Testing
          - Physical Security
          - Policy Acceptance
          - Policy Management
          - Procedure Management
          - Procedures Acceptance
          - Risk Assessment
          - Risk Tracking
          - Risk Treatment
          - SAST
          - Security Monitoring
          - Tracking
          - Training
          - Vendor Management
          - Vendor Review
          - Version Control
          - Vulnerability Scans
          - Vulnerability Tracking
      - name: test_interval_seconds
        description: How often new evidence should be collected for the test.
        required: false
        in: query
        schema:
          type: string
          enum:
          - one_day
          - one_week
          - two_weeks
          - one_month
          - three_months
          - six_months
          - one_year
          - none
      - name: title
        description: The test title.
        required: true
        in: query
        schema:
          type: string
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Data envelope for the response
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The identifier for this resource
                      type:
                        type: string
                        description: The type of resource this object is
                      attributes:
                        $ref: '#/components/schemas/Test'
                      relationships:
                        type: object
                        description: Nested objects related to the top level object
                      links:
                        type: object
                        description: Links to related API resources
                  included:
                    type: array
                    items:
                      type: object
                      description: Various objects that have been included via the `include` param
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The identifier for this resource
        '404':
          description: Resource not found
        '403':
          description: Forbidden
        '401':
          description: Unauthorized
        '400':
          description: Bad Request
      description: 'Creates an upload Test: a Test that passes while current evidence is attached to it.'
      summary: Create a Test
      security:
      - header_authorization: []
      x-controller: api/company_tests
      x-action: create
  /tests/{id}:
    get:
      tags:
      - Test
      operationId: companyTestsShow
      parameters:
      - name: id
        description: Scope response to id
        required: true
        in: path
        schema:
          type: string
      - name: include
        description: Comma delimited string of relationships to include.
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - enabled_field_updated_by
            - owner
            - promoted_by
        explode: false
        style: form
      - name: relationships
        description: 'Set to true to return the associated relationships data within the response. (default: false)'
        required: false
        in: query
        schema:
          type: boolean
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Data envelope for the response
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The identifier for this resource
                      type:
                        type: string
                        description: The type of resource this object is
                      attributes:
                        $ref: '#/components/schemas/Test'
                      relationships:
                        type: object
                        description: Nested objects related to the top level object
                      links:
                        type: object
                        description: Links to related API resources
                  included:
                    type: array
                    items:
                      type: object
                      description: Various objects that have been included via the `include` param
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The identifier for this resource
        '404':
          description: Resource not found
        '403':
          description: Forbidden
        '401':
          description: Unauthorized
        '400':
          description: Bad Request
      description: Returns a Test by ID
      summary: Get a Test
      security:
      - header_authorization: []
      x-controller: api/company_tests
      x-action: show
    put:
      tags:
      - Test
      operationId: companyTestsUpdate
      parameters:
      - name: disabled_justification
        description: The justification reason for why this test is disabled.
        required: false
        in: query
        schema:
          type: string
      - name: enabled
        description: true or false for whether this test should be enabled or disabled.
        required: false
        in: query
        schema:
          type: boolean
      - name: id
        description: Scope response to id
        required: true
        in: path
        schema:
          type: string
      - name: next_due_date
        description: Date time in ISO8601 format.
        required: false
        in: query
        schema:
          type: string
          format: date-time
      - name: owner_id
        description: The UUID of a user.
        required: false
        in: query
        schema:
          type: string
          format: uuid
      - name: passed_with_upload_justification
        description: The justification reason for why this test is passed with upload.
        required: false
        in: query
        schema:
          type: string
      - name: promote_at
        description: Date time in ISO8601 format.
        required: false
        in: query
        schema:
          type: string
          format: date-time
      - name: test_interval_seconds
        description: How often the test should be run.
        required: false
        in: query
        schema:
          type: string
          enum:
          - one_day
          - one_week
          - two_weeks
          - one_month
          - three_months
          - six_months
          - one_year
          - none
      - name: tolerance_window_seconds
        description: The tolerance window representation for a test to be at risk.
        required: false
        in: query
        schema:
          type: string
          enum:
          - one_day
          - one_week
          - two_weeks
          - one_month
          - three_months
          - six_months
          - one_year
          - none
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Data envelope for the response
                    properties:
                      id:
                        type: string
