      summary: Update a Test
      security:
      - header_authorization: []
      x-controller: api/company_tests
      x-action: update
components:
  schemas:
    Test:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The identifier for this test.
        control_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The IDs of the controls that the test is associated with.
        control_keys:
          type: array
          items:
            type: string
          description: The keys of the controls that the test is associated with.
        created_at:
          type: string
          format: date-time
          description: The date when this test was created.
        custom:
          type: boolean
          description: True if the test is custom (user generated), false if it's Secureframe-authored.
        description:
          type: string
          description: The description for the test.
        detailed_remediation_steps:
          type: string
          description: Guidance for remediating this test in the event it fails.
        disabled_justification:
          type: string
          description: Reason for disabling the test.
        enabled:
          type: boolean
          description: True if the test is currently enabled.
        enabled_field_updated_by_user_name:
          type: string
          description: The name of the user who enabled the test, null if wasn't enabled by a user.
        failure_message:
          type: string
          description: The message to be displayed if the test fails.
        first_failed_at:
          type: string
          format: date-time
          description: The date the test first failed.
        framework_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The IDs of the frameworks that the test is associated with.
        framework_keys:
          type: array
          items:
            type: string
          description: The keys of the frameworks that the test is associated with.
        health_status:
          type: string
          description: The overall health of the test.
        key:
          type: string
          description: The user-friendly identifier used to reference this test.
        last_evaluated:
          type: string
          format: date-time
          description: The date the test was last evaluated at.
        last_passed_at:
          type: string
          format: date-time
          description: The date the test last had a passing evaluation.
        next_due_date:
          type: string
          format: date-time
          description: The date new test evidence is needed by if applicable.
        owner_assigned_at:
          type: string
          format: date-time
          description: The date the test owner was assigned.
        owner_name:
          type: string
          description: The test owner's name.
        pass:
          type: boolean
          description: True if the test is passing, false otherwise.
        passed_with_upload:
          type: boolean
          description: True if the test passed from the existence of an upload, false otherwise.
        passed_with_upload_justification:
          type: string
          description: The justification used on evidence upload to pass the test if applicable.
        promote_at:
          type: string
          format: date-time
          description: The current date set for implementation of the test.
        promoted_by_name:
          type: string
          description: The name of the user who set the implementation date.
        recommended_action:
          type: string
          description: Actions for completing the test.
        required_implementation_date:
          type: string
          format: date-time
          description: The pre-configured date the test must be implemented by.
        resource_category:
          type: string
          description: The category the test resource belongs to.
        test_domain:
          type: string
          description: The domain the test belongs to.
        test_function:
          type: string
          description: The purpose of the test.
        test_interval_seconds:
          type: integer
          description: The interval in which test evidence should be collected if applicable.
        test_type:
          type: string
          enum:
          - upload
          - integration
          - platform
          description: The type of test.
        title:
          type: string
          description: The test title.
        tolerance_window_seconds:
          type: integer
          description: The time between the test interval elapsing and evidence becoming stale and test failing if applicable.
        updated_at:
          type: string
          format: date-time
          description: The date the test was last updated.
        vendor_name:
          type: string
          description: The vendor name associated with the test if applicable.
  securitySchemes:
    header_authorization:
      type: apiKey
      name: Authorization
      in: header
