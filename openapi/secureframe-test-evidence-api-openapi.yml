openapi: 3.2.0
info:
  title: Secureframe Test Evidence API
  description: '## Introduction


    Secureframe exposes a REST API for use by customers, partners, and community developers.'
  version: '2023-10-18'
  x-logo:
    url: https://media.secureframe.com/logo-dark.svg
servers:
- url: https://api.secureframe.com
- url: https://api-uk.secureframe.com
tags:
- name: Test Evidence
  description: This document describes the API for creating Evidence for a Test.
paths:
  /tests/{test_id}/evidences:
    post:
      tags:
      - Test Evidence
      operationId: companyTestsEvidencesCreate
      parameters:
      - name: activity_completion
        description: The date the activity was completed, as `YYYY-MM-DD`.
        required: false
        in: query
        schema:
          type: string
          format: date
      - name: test_id
        description: The ID of the Test to attach the evidence
        required: true
        in: path
        schema:
          type: string
          format: uuid
      - name: upload_id
        description: The `id` returned by `POST /file_uploads` — the `create_file_upload` tool — whose bytes you have already PUT to storage. The way to attach a preloaded file. Required unless `file` is given.
        required: false
        in: query
        schema:
          type: string
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Data envelope for the response
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The identifier for this resource
                      type:
                        type: string
                        description: The type of resource this object is
                      attributes:
                        $ref: '#/components/schemas/Evidence'
                      relationships:
                        type: object
                        description: Nested objects related to the top level object
                      links:
                        type: object
                        description: Links to related API resources
                  included:
                    type: array
                    items:
                      type: object
                      description: Various objects that have been included via the `include` param
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The identifier for this resource
        '404':
          description: Resource not found
        '403':
          description: Forbidden
        '401':
          description: Unauthorized
        '400':
          description: Bad Request
      description: 'Uploads evidence to a Test.


        Send the file one of two ways, and provide exactly one of them.


        `upload_id` attaches a file whose bytes you sent straight to storage, which is the right

        choice for anything large and the only workable one for a caller that cannot send

        multipart. Three steps:


        1. Call `POST /file_uploads` with the file''s `filename`, `byte_size` and `checksum`. It

        returns a short-lived `url`, the `headers` to send with it, and an `id`.

        2. PUT the file''s bytes to that `url`, with exactly the `headers` returned. The request

        body is the file''s contents as they are on disk — raw bytes, not base64, not multipart,

        not wrapped in JSON — so there is nothing to encode or convert.

        3. Send the `id` here as `upload_id`.


        `file` is the alternative for a direct REST caller — the file''s bytes as a multipart

        upload in this request, with no preloading step.'
      summary: Create Test Evidence
      security:
      - header_authorization: []
      x-controller: api/company_tests/evidences
      x-action: create
      x-mcp-description: 'Attach an evidence file to a Test.


        The bytes are not sent here. Stage the file first with the `create_file_upload` tool,

        which hands back a `url` and an `id`; PUT the file''s raw bytes to that `url`; then call

        this tool with that `id` as `upload_id`. The bytes must already be in storage by the

        time you call this — an `upload_id` whose PUT never happened is refused rather than

        attached empty. `create_file_upload` documents the size limit and the two expiry

        windows.


        Each `upload_id` is redeemable once. Attaching the same file to a second Test means

        staging it again.'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The evidence file's bytes, as a multipart upload in this request. The alternative to `upload_id`, for a direct REST caller. Required unless `upload_id` is given.
                  example: Users/Downloads/some_file.png
