        owner_name:
          type: string
          description: The control owner's name.
        passing_test_count:
          type: integer
          description: The number of associated tests currently passing.
        updated_at:
          type: string
          format: date-time
          description: The date when the control was last updated.
    FrameworkAssetScope:
      type: object
      properties:
        id:
          type: string
          format: uuid
