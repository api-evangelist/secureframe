  "/file_uploads":
    post:
      tags:
      - File Upload
      operationId: fileUploadsCreate
      parameters:
      - name: byte_size
        description: The exact size of the file in bytes. Must be 32 MB or smaller;
          a larger file is refused here rather than at the upload.
        required: true
        in: query
        schema:
          type: integer
      - name: checksum
        description: The base64-encoded MD5 digest of the file's raw bytes.
        required: true
        in: query
        schema:
          type: string
      - name: content_type
        description: The file's MIME type. Inferred from the filename when omitted.
        required: false
        in: query
        schema:
          type: string
      - name: filename
        description: The file's name, including its extension (for example `evidence.png`).
        required: true
        in: query
        schema:
          type: string
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Data envelope for the response
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The identifier for this resource
                      type:
                        type: string
                        description: The type of resource this object is
                      attributes:
                        "$ref": "#/components/schemas/FileUpload"
                      relationships:
                        type: object
                        description: Nested objects related to the top level object
                      links:
                        type: object
                        description: Links to related API resources
                  included:
                    type: array
                    items:
                      type: object
                      description: Various objects that have been included via the
                        `include` param
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The identifier for this resource
        '403':
          description: Forbidden
        '401':
          description: Unauthorized
        '400':
          description: Bad Request
      description: |-
        Stage a file upload.

        Stages a file so its bytes can be sent straight to storage rather than through this API.
        Three steps:

        1. Call this endpoint with the file's `filename`, `byte_size` and `checksum`. It returns a
           `url` to upload to, the `headers` to send with it, and an `id` to attach with. The two
           have separate deadlines: the `url` stops being accepted at `url_expires_at`, while the
           `id` stays redeemable until the later `id_expires_at`, so an upload whose bytes have
           already landed can still be attached after the URL is dead.
        2. PUT the file's bytes to that `url`, with exactly the `headers` returned. The request
           body is the file's contents as they are on disk — raw bytes, not base64, not multipart,
           not wrapped in JSON — so there is nothing to encode or convert. Send the headers
           unaltered, and make sure the bytes match the `byte_size` and `checksum` declared in
           step 1, or storage rejects the PUT.
        3. Send the `id` to an endpoint that attaches it, as `upload_id` in place of a multipart
           `file`. Each `id` is redeemable once; attaching the same file again means staging it
           again from step 1. The endpoints that accept an upload today are:
           - `POST /tests/{test_id}/evidences`:
             https://api.secureframe.com/docs#tag/test-evidence/POST/tests/{test_id}/evidences
           - `POST /users/{user_id}/evidences`:
             https://api.secureframe.com/docs#tag/user-evidence/POST/users/{user_id}/evidences
           - `PUT /trust_center_requests/{id}`:
             https://api.secureframe.com/docs#tag/trust-center-request/PUT/trust_center_requests/{id}
      summary: Stage a direct-to-storage File Upload and get an id for attaching the
        file
      security:
      - header_authorization: []
      x-controller: api/file_uploads
      x-action: create
      x-mcp-description: |-
        Stage a file so its bytes go straight to storage rather than through this API, and get
        back an id to attach it with. Uploading a file takes three steps, and only the first and
        third are tools — the middle one you make yourself.

        1. Call this tool with the file's `filename`, `byte_size` and `checksum`. The response
           contains a `url`, a `headers` object, and an `id`.
        2. PUT the file's bytes to that `url`, sending every entry in `headers` as a header,
           unaltered. The request body is the file's contents as they are on disk — raw bytes,
           not base64, not multipart, not wrapped in JSON — so there is nothing to encode or
           convert. Storage rejects the PUT unless the bytes match the `byte_size` and
           `checksum` declared in step 1, so declare them from the file you are actually sending.
        3. Pass the `id` as `upload_id` to the tool that attaches it: `create_test_evidence`,
           `create_user_evidence` or `update_trust_center_request`. Each `id` is redeemable
           once; attaching the same file again means staging it again from step 1.

        A file must be 32 MB or smaller. A larger `byte_size` is refused here, in step 1, before
        you have spent anything on the upload itself.

        The two halves of the handshake expire apart, and the response dates both. The `url`
        stops being accepted 15 minutes after staging, at `url_expires_at`; the `id` stays
        redeemable for an hour, until `id_expires_at`. Bytes that have already landed can
        therefore still be attached after the URL is dead, but a batch of uploads staged up
        front must all be PUT inside that first 15 minutes.
