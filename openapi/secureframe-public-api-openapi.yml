    FileUpload:
      type: object
      properties:
        id:
          type: string
          description: The identifier to redeem at an endpoint that accepts an upload.
        url:
          type: string
          description: The URL to PUT the file's raw bytes to.
        headers:
          type: object
          description: Headers that must be sent verbatim on the PUT.
        url_expires_at:
          type: string
          format: date-time
          description: 'The deadline for the PUT: after this, `url` stops being accepted.'
        id_expires_at:
          type: string
          format: date-time
          description: The deadline for redeeming `id` as an `upload_id` at an attaching
            endpoint. Later than `url_expires_at`, so an upload whose bytes have already
            landed stays attachable after the URL is dead.
        created_at:
          type: string
          format: date-time
          description: The date this File Upload was created.
        updated_at:
          type: string
          format: date-time
          description: The date this File Upload was last updated. File Uploads are
            immutable, so this always equals `created_at`.
      description: |-
        A File Upload is write-only and single-use: it is returned once, redeemed once, and there is
        no endpoint to fetch one back.
