description: Secureframe publishes three named packages on its pricing page — Fundamentals, Complete and Defense
  — with a feature comparison table. Only Fundamentals carries a public number ("Starting at $7,000/year");
  Complete and Defense are "Get a quote". API access is not itemised as a separate line on any tier and is
  not metered.
plan_count: 3
notes: No self-serve signup and no published API pricing. Every tier routes to "Get a quote"; the API and the
  hosted MCP server are included with a paid subscription rather than sold separately, and there is no usage-based
  API charge, quota or overage published anywhere.
