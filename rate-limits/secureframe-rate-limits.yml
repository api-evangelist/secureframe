specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Secureframe
providerId: secureframe
created: '2026-05-08'
modified: '2026-08-27'
generated: '2026-08-27'
method: searched
source: https://api.secureframe.com/docs — "Rate Limiting" and "Errors" sections of the OpenAPI info.description
  (fetched 2026-08-27)
reconciled: true
tags:
- GRC
- Compliance
- SOC 2
- ISO 27001
- Risk
- Rate Limiting
- Quotas
- Throttling
description: 'Secureframe publishes exactly one rate limit and it is stated as a quoted number in the API reference:
  500 requests per minute per IP address, 429 on exhaustion. The value is documented; the runtime signal is
  not.'
limit_count: 1
responseCodes:
  throttled: 429
response_headers:
  published: false
  x_ratelimit: false
  ratelimit_draft: false
  retry_after: false
  note: No X-RateLimit-*, RateLimit-* or Retry-After header is documented anywhere, and 429 is declared on
    ZERO of the 112 OpenAPI operations. A client cannot see its remaining budget, and a client generated from
    the spec will not even model the throttled path — it discovers the ceiling by hitting it.
limits:
- name: Public API default
  scope: per-ip
  metric: requests
  limit: 500
  window: 1 minute
  burst: null
  status_on_exhaustion: 429
  quote: Requests are limited to 500 requests per minute per IP address. If the limit is exceeded, requests
    will be blocked until requests are available based on the aforementioned limit.
  source: https://api.secureframe.com/docs
  note: Per IP address, NOT per API key or per company — so every process behind one NAT egress shares one
    budget, and a customer cannot buy headroom by issuing more keys.
mcp:
  endpoint: https://mcp.secureframe.com/
  published_limit: null
  note: No rate limit is published for the hosted MCP server. Its tools wrap the same REST API, so the 500/min
    per-IP ceiling is the assumed effective bound, but Secureframe does not state this.
interaction_with_bulk: The reference also states the API does not support bulk updates — one object per request.
  A 500/min per-IP ceiling with no bulk endpoints and no idempotency key makes any large compliance write a
  slow serial loop with an unsafe retry path.
policies:
- name: Backoff strategy
  description: Not published by Secureframe. Clients should implement exponential backoff with jitter; no Retry-After
    value is returned to honour.
  method: inferred
related:
